name: Android CD Release

# Trigger the workflow automatically when code is pushed or merged into the 'main'
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Sign Release APK
    runs-on: ubuntu-lastest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle # Enables Gradle catching to improve build times

        # Decodes the Firebase configuration from GitHub Secrets into the app directory
      - name: Decode Firebase google-services.json
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_JSON_BASE64 }}
        run: echo $FIREBASE_SECRET | base64 --decode > ./app/google-services.json

      - name: Grant execute permissions for gradlew
        run: chmod +x gradlew

      # Compiles and builds the release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # Signs the generated APK using the Keystore provided via GitHub Secrets
      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # Uploads the signed APK as an artifact of this GitHub Actions run
      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: ${{steps.sign_app.outputs.signedReleaseFile}}
          retention-days: 14 # Keeps the APK available for download for 14 days




